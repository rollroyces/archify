name: rebuild-archify-zip

# One-shot helper used during PR #405 to fetch a Linux-built archify.zip
# so the zip-freshness gate (which compares byte-for-byte against a
# commit produced by ubuntu-latest + Node 22) can be made consistent.
# Triggered manually via workflow_dispatch on the rollroyces/archify
# fork; the resulting artifact is downloaded, committed back to the
# branch, then the workflow file is removed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build archify.zip on Linux + Node 22
        run: scripts/build-zip.sh archify.zip
      - name: Upload rebuilt archify.zip
        uses: actions/upload-artifact@v4
        with:
          name: archify-zip
          path: archify.zip
          if-no-files-found: error
          retention-days: 7